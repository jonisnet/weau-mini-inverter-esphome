<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#374151;stroke-width:2;rx:10}
      .t{font-size:17px;font-weight:700;fill:#111827}
      .s{font-size:13px;fill:#374151}
      .m{font-size:12px;fill:#6b7280}
      .ln{stroke:#374151;stroke-width:2;fill:none}
      .dash{stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="1100" height="620" fill="#f8fafc"/>
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">W'eau Mini Inverter (WMIP-003) — system overview</text>

  <!-- Home Assistant -->
  <rect x="860" y="70" width="210" height="90" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="965" y="105" text-anchor="middle" class="t">Home Assistant</text>
  <text x="965" y="127" text-anchor="middle" class="s">ESPHome integration</text>
  <text x="965" y="145" text-anchor="middle" class="m">native API, encrypted</text>

  <!-- Wi-Fi board -->
  <rect x="600" y="210" width="230" height="200" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="715" y="240" text-anchor="middle" class="t">Wi-Fi board CC1150B</text>
  <text x="715" y="262" text-anchor="middle" class="s">TYWE3S (ESP8266)</text>
  <text x="715" y="280" text-anchor="middle" class="s">runs ESPHome</text>
  <text x="715" y="306" text-anchor="middle" class="m">U3: 5 V → 3.3 V regulator</text>
  <text x="715" y="324" text-anchor="middle" class="m">Q3/Q6/Q7: RX/TX level stage</text>
  <rect x="625" y="345" width="180" height="48" rx="6" fill="#fff" stroke="#047857"/>
  <text x="715" y="365" text-anchor="middle" class="s">5-pin header</text>
  <text x="715" y="383" text-anchor="middle" class="m">5V · GND · RX · TX · RST</text>

  <path class="ln dash" d="M760,210 C800,170 830,140 860,125" marker-end="url(#a)"/>
  <text x="835" y="200" class="m">Wi-Fi (2.4 GHz)</text>

  <!-- Controller -->
  <rect x="200" y="190" width="330" height="270" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="365" y="220" text-anchor="middle" class="t">Controller / display CC1150A</text>
  <text x="365" y="242" text-anchor="middle" class="s">MCU (Tuya MCU protocol) · LCD · buttons ▲ ▼ power M</text>
  <text x="225" y="275" class="s">Sensors (NTC):</text>
  <text x="240" y="295" class="m">AD1 yellow – exhaust temp</text>
  <text x="240" y="312" class="m">AD2 red – inlet water temp</text>
  <text x="240" y="329" class="m">AD3 black – coil temp</text>
  <text x="240" y="346" class="m">AD4 white – ambient temp</text>
  <text x="240" y="363" class="m">CN8 green – water flow switch</text>
  <text x="225" y="392" class="s">Outputs: AC-L/AC-N, OUT1–3, 4-way valve</text>
  <text x="225" y="420" class="s">CN3 A/B: RS485 to driver board</text>
  <text x="225" y="440" class="m">(not reachable over Tuya)</text>

  <path class="ln" d="M600,370 L530,370" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="565" y="360" text-anchor="middle" class="m">UART</text>
  <text x="565" y="392" text-anchor="middle" class="m">9600 8N1</text>

  <!-- Driver board -->
  <rect x="200" y="500" width="330" height="90" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="365" y="530" text-anchor="middle" class="t">Inverter driver board</text>
  <text x="365" y="552" text-anchor="middle" class="s">CN485 · compressor U/V/W · DC fan</text>
  <text x="365" y="572" text-anchor="middle" class="m">compressor current/speed, DC bus (menu A10–A15)</text>
  <path class="ln" d="M365,460 L365,500" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="375" y="485" class="m">RS485 (CN3 ↔ CN485)</text>

  <!-- Mains -->
  <rect x="20" y="270" width="140" height="70" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="90" y="300" text-anchor="middle" class="t">230 V mains</text>
  <text x="90" y="320" text-anchor="middle" class="m">RCD plug</text>
  <path class="ln" d="M160,305 L200,305" marker-end="url(#a)"/>
  <path class="ln" d="M90,340 L90,545 L200,545" marker-end="url(#a)"/>
</svg>
