<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .t{font-size:17px;font-weight:700;fill:#111827}
    .s{font-size:13px;fill:#374151}
    .m{font-size:12px;fill:#6b7280}
    .pin{font-size:13px;font-weight:700;fill:#111827}
    .w{stroke-width:4;fill:none;stroke-linecap:round}
  </style>
  <rect width="1100" height="560" fill="#f8fafc"/>
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">First flash — USB-TTL adapter to the Wi-Fi board (CC1150B)</text>
  <text x="550" y="60" text-anchor="middle" class="s">Board removed from the controller · Dupont jumper wires, no soldering · adapter with 3.3 V logic (e.g. CP2102)</text>

  <!-- USB-TTL adapter -->
  <rect x="60" y="110" width="260" height="300" rx="12" fill="#111827"/>
  <rect x="120" y="80" width="140" height="40" rx="4" fill="#9ca3af"/>
  <text x="190" y="105" text-anchor="middle" font-size="12" fill="#111827">USB</text>
  <text x="190" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">USB-TTL (CP2102)</text>
  <g font-size="14" font-weight="700" fill="#fff">
    <text x="300" y="200" text-anchor="end">3V3</text>
    <text x="300" y="235" text-anchor="end">GND</text>
    <text x="300" y="270" text-anchor="end">+5V</text>
    <text x="300" y="305" text-anchor="end">TXD</text>
    <text x="300" y="340" text-anchor="end">RXD</text>
    <text x="300" y="375" text-anchor="end">DTR</text>
  </g>
  <g fill="#d1d5db"><circle cx="320" cy="195" r="6"/><circle cx="320" cy="230" r="6"/><circle cx="320" cy="265" r="6"/><circle cx="320" cy="300" r="6"/><circle cx="320" cy="335" r="6"/><circle cx="320" cy="370" r="6"/></g>
  <text x="205" y="398" text-anchor="middle" font-size="11" fill="#9ca3af">3V3 and DTR unused</text>

  <!-- CC1150B board -->
  <rect x="640" y="130" width="400" height="300" rx="12" fill="#14532d"/>
  <text x="840" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Wi-Fi board CC1150B</text>
  <!-- header -->
  <rect x="660" y="180" width="40" height="190" rx="4" fill="#111"/>
  <g fill="#e5e7eb"><circle cx="680" cy="195" r="7"/><circle cx="680" cy="230" r="7"/><circle cx="680" cy="265" r="7"/><circle cx="680" cy="300" r="7"/><circle cx="680" cy="335" r="7"/></g>
  <g font-size="14" font-weight="700" fill="#fff">
    <text x="712" y="200">5V</text><text x="712" y="235">GND</text><text x="712" y="270">RX</text><text x="712" y="305">TX</text><text x="712" y="340">RST</text>
  </g>
  <!-- module -->
  <rect x="800" y="200" width="200" height="190" rx="6" fill="#d1d5db" stroke="#9ca3af"/>
  <rect x="1000" y="200" width="30" height="190" fill="#1e3a8a"/>
  <text x="900" y="285" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">TYWE3S</text>
  <text x="900" y="305" text-anchor="middle" font-size="12" fill="#374151">ESP8266</text>
  <text x="1015" y="300" text-anchor="middle" font-size="11" fill="#fff" transform="rotate(90 1015 300)">antenna</text>
  <!-- bottom pins -->
  <g fill="#f59e0b">
    <rect x="808" y="388" width="14" height="18"/><rect x="832" y="388" width="14" height="18"/><rect x="856" y="388" width="14" height="18"/>
    <rect x="880" y="388" width="14" height="18" fill="#dc2626"/>
    <rect x="904" y="388" width="14" height="18"/><rect x="928" y="388" width="14" height="18"/><rect x="952" y="388" width="14" height="18"/><rect x="976" y="388" width="14" height="18"/>
  </g>
  <text x="815" y="425" text-anchor="middle" font-size="11" fill="#fff">GND</text>
  <text x="887" y="425" text-anchor="middle" font-size="11" font-weight="700" fill="#fecaca">GPIO0</text>

  <!-- wires -->
  <path class="w" stroke="#2563eb" d="M326,230 C480,230 520,230 674,230"/>
  <path class="w" stroke="#f97316" d="M326,265 C470,265 520,195 674,195"/>
  <path class="w" stroke="#eab308" d="M326,300 C470,300 520,265 674,265"/>
  <path class="w" stroke="#16a34a" d="M326,335 C470,335 520,300 674,300"/>
  <!-- gpio0 jumper -->
  <path class="w" stroke="#dc2626" stroke-dasharray="8 6" d="M887,406 C887,480 600,500 520,470 C440,440 420,250 326,236"/>

  <!-- legend -->
  <g font-size="13" fill="#111827">
    <rect x="60" y="440" width="18" height="6" fill="#f97316"/><text x="86" y="447">+5V → 5V</text>
    <rect x="60" y="460" width="18" height="6" fill="#2563eb"/><text x="86" y="467">GND → GND</text>
    <rect x="200" y="440" width="18" height="6" fill="#eab308"/><text x="226" y="447">TXD → RX</text>
    <rect x="200" y="460" width="18" height="6" fill="#16a34a"/><text x="226" y="467">RXD → TX</text>
  </g>
  <text x="60" y="505" class="s"><tspan font-weight="700" fill="#dc2626">Bootloader:</tspan> hold a GND wire against the GPIO0 pad (bottom row, 4th from the left, antenna on the right)</text>
  <text x="60" y="525" class="s">while plugging in the USB adapter, release after ~1 s, then press Connect → Install in web.esphome.io.</text>
  <text x="60" y="545" class="m">If the header path does not respond, wire TXD/RXD straight to the module's RXD/TXD pads (see pinout) — the Q3/Q6/Q7 stage sits in between.</text>
</svg>
