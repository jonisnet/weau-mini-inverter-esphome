# Copy to secrets.yaml (or add to the secrets of your ESPHome Builder) and fill in.
wifi_ssid: "your-wifi"
wifi_password: "your-wifi-password"
# 32-byte base64 key, e.g. generated by the ESPHome Builder or: openssl rand -base64 32
api_encryption_key: "REPLACE_WITH_BASE64_KEY"
fallback_ap_password: "choose-a-password"
