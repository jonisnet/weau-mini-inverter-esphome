# W'eau Mini Inverter pool heat pump (WMIP-003 / WMI-003 / WMI-004) — local control with ESPHome.
# Runs on the ORIGINAL Tuya Wi-Fi module (TYWE3S / ESP8266) on the CC1150B Wi-Fi board inside
# the CC1150A controller. No Tuya cloud, no extra hardware.
#
# See README.md for the datapoint map, error codes and the flashing guide.

substitutions:
  name: weau-pool-heat-pump
  friendly_name: Pool heat pump

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: esp01_1m

logger:
  baud_rate: 0          # UART0 is used for the controller link — no serial logging
  level: DEBUG
  logs:
    tuya: INFO          # the controller repeats DP20 (faults) several times per second
    sensor: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:
      key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  ap:
    ssid: "Pool heat pump fallback"
    password: !secret fallback_ap_password

captive_portal:

# TYWE3S RX/TX (GPIO3/GPIO1) <-> controller CC1150A, Tuya MCU protocol
uart:
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600

# ---------------------------------------------------------------------------
# Datapoints (Tuya MCU), product id zqwet1zcvj2wcxzw.
# Fully scanned: DP1..255, all five Tuya types (bool, enum, value, string, raw).
# The controller only accepts writes to DP1, DP2 and DP9.
#   DP1   power on/off                           read/write
#   DP2   mode: 1 = heat, 4 = cool                read/write (0/2/3 rejected)
#   DP9   target temperature of the active mode   read/write (within DP103..DP102)
#   DP10  inlet water temperature x0.1            read
#   DP20  fault bitmask, bit n = E(n+1)           read (4 = E03 no water flow)
#   DP101 value, presumably compressor            read (0 while not running)
#   DP102 max settable: 40 heat / 28 cool         read
#   DP103 min settable: 15 heat / 8 cool          read
#   DP104 bool, meaning unknown                   read only
#   The display key lock is local to the display and is NOT exposed over Tuya.
# ---------------------------------------------------------------------------
tuya:
  id: tuya_mcu

climate:
  - platform: tuya
    name: "Heat pump"
    icon: mdi:pool-thermometer
    switch_datapoint: 1
    target_temperature_datapoint: 9
    current_temperature_datapoint: 10
    current_temperature_multiplier: 0.1
    target_temperature_multiplier: 1
    supports_heat: true
    supports_cool: true
    active_state:
      datapoint: 2
      heating_value: 1
      cooling_value: 4
    # The tuya climate only READS DP2; write it ourselves when the mode is changed from HA
    on_control:
      - lambda: |-
          auto mode = x.get_mode();
          if (!mode.has_value()) return;
          if (*mode == climate::CLIMATE_MODE_HEAT) id(tuya_mcu).set_enum_datapoint_value(2, 1);
          else if (*mode == climate::CLIMATE_MODE_COOL) id(tuya_mcu).set_enum_datapoint_value(2, 4);
    visual:
      min_temperature: 8
      max_temperature: 40
      temperature_step:
        target_temperature: 1
        current_temperature: 0.1

sensor:
  - platform: tuya
    name: "Water temperature"
    sensor_datapoint: 10
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: tuya
    id: max_temp
    name: "Max settable temperature"
    sensor_datapoint: 102
    unit_of_measurement: "°C"
    entity_category: diagnostic
  - platform: tuya
    name: "Min settable temperature"
    sensor_datapoint: 103
    unit_of_measurement: "°C"
    entity_category: diagnostic
  - platform: tuya
    name: "Compressor (DP101)"
    sensor_datapoint: 101
    entity_category: diagnostic
  - platform: tuya
    id: fault_raw
    name: "Fault bits (DP20)"
    sensor_datapoint: 20
    entity_category: diagnostic
    filters:
      - delta: 0.5
  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

binary_sensor:
  - platform: tuya
    name: "DP104 (unknown)"
    sensor_datapoint: 104
    entity_category: diagnostic
  - platform: template
    name: "Fault active"
    device_class: problem
    lambda: |-
      if (!id(fault_raw).has_state()) return {};
      return id(fault_raw).state > 0.5;

text_sensor:
  - platform: template
    name: "Mode"
    icon: mdi:sun-snowflake-variant
    update_interval: 5s
    lambda: |-
      if (!id(max_temp).has_state()) return {};
      return id(max_temp).state > 30 ? std::string("Heating") : std::string("Cooling");
  - platform: template
    name: "Fault"
    icon: mdi:alert-circle-outline
    update_interval: 5s
    lambda: |-
      if (!id(fault_raw).has_state()) return {};
      uint32_t v = (uint32_t) id(fault_raw).state;
      if (v == 0) return {"None"};
      std::string s;
      for (int i = 0; i < 32; i++) {
        if (!(v & (1u << i))) continue;
        int code = i + 1;
        const char *d;
        switch (code) {
          case 3:  d = "water flow failure"; break;
          case 4:  d = "freezing protection"; break;
          case 9:  d = "communication failure (controller-PCB)"; break;
          case 10: d = "communication failure (controller-driver board)"; break;
          case 12: d = "high exhaust temperature protection"; break;
          case 15: d = "inlet temperature sensor failure"; break;
          case 16: d = "piping temperature sensor failure"; break;
          case 18: d = "exhaust temperature sensor failure"; break;
          case 20: d = "inverter module failure"; break;
          case 21: d = "ambient temperature sensor failure"; break;
          case 23: d = "outlet water too cold (cooling)"; break;
          case 27: d = "outlet temperature sensor failure"; break;
          case 32: d = "outlet water too hot (heating)"; break;
          default: d = "unknown"; break;
        }
        char b[72];
        snprintf(b, sizeof(b), "E%02d %s", code, d);
        if (!s.empty()) s += ", ";
        s += b;
      }
      return s;
